<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sorteio do Comparativo: quem apresenta em 09/12</title>
<style>
  :root{--bg:#0f1b2d;--card:#18283f;--line:#2b4161;--ink:#f3f6fb;--mute:#9fb2cc;--acc:#ffb703;--ok:#3ddc97}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding:28px 24px 40px}
  h1{margin:0 0 4px;font-size:clamp(26px,4vw,44px);letter-spacing:-.5px}
  .sub{color:var(--mute);font-size:clamp(15px,1.8vw,20px);margin-bottom:22px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:22px}
  .g{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px 18px;transition:transform .12s,border-color .12s,background .12s}
  .g b{font-size:clamp(20px,2.4vw,28px)}
  .g span{display:block;color:var(--mute);margin-top:4px;font-size:clamp(14px,1.5vw,18px)}
  .g.spin{border-color:var(--acc);background:#2a3550;transform:scale(1.04)}
  .g.out{opacity:.28}
  .bar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px}
  button{font:inherit;font-weight:700;font-size:clamp(18px,2.2vw,26px);padding:14px 26px;border-radius:12px;border:0;cursor:pointer;background:var(--acc);color:#1b1400}
  button.sec{background:transparent;color:var(--ink);border:2px solid var(--line)}
  button:disabled{opacity:.4;cursor:default}
  .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
  .col{background:var(--card);border-radius:14px;padding:18px;min-height:150px;border:2px solid var(--line)}
  .col h2{margin:0 0 10px;font-size:clamp(20px,2.4vw,30px)}
  .col h2 small{color:var(--mute);font-weight:400;font-size:.6em}
  .item{background:#223653;border-left:6px solid var(--ok);border-radius:8px;padding:10px 12px;margin-top:8px;font-size:clamp(17px,2vw,24px);animation:pop .35s}
  .item small{display:block;color:var(--mute);font-size:.7em}
  @keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
  .log{color:var(--mute);margin-top:18px;font-size:14px}
</style>
</head>
<body>
<h1>Quem apresenta em 09/12?</h1>
<div class="sub">Sorteio ao vivo: 3 grupos vão para 09/12, os outros 2 ficam com 02/12 (o Grupo 3 apresenta hoje e está fora do sorteio).</div>

<div class="grid" id="grid"></div>

<div class="bar">
  <button id="draw">Sortear próximo grupo para 09/12</button>
  <button id="order" class="sec" disabled>Sortear ordem de cada dia</button>
  <button id="reset" class="sec">Recomeçar</button>
</div>

<div class="cols">
  <div class="col"><h2>09/12 <small>(sorteados)</small></h2><div id="c9"></div></div>
  <div class="col"><h2>02/12 <small>(os que sobraram)</small></h2><div id="c2"></div></div>
</div>
<div class="log" id="log"></div>

<script>
const GROUPS=[
 {n:1,t:"TAM 3054 × colisão de trens na Espanha"},
 {n:2,t:"Proconsult × placares das checagens do JN"},
 {n:4,t:"Riocentro × números do TSE sobre seções"},
 {n:5,t:"Vazamento do Enem 2009 × abstenção no 2º dia"},
 {n:6,t:"Jimmy's World × GloboNews corrige fala"}
];
// Sorteio justo: crypto.getRandomValues com rejeição, sem viés de módulo
function rnd(n){const lim=Math.floor(4294967296/n)*n;const a=new Uint32Array(1);do{crypto.getRandomValues(a)}while(a[0]>=lim);return a[0]%n}
const $=id=>document.getElementById(id);
let pool,d9,d2,busy,log;
function init(){pool=GROUPS.slice();d9=[];d2=[];busy=false;log=[];render();$('draw').disabled=false;$('order').disabled=true;$('log').textContent=''}
function card(g,cls){return `<div class="g ${cls||''}" data-n="${g.n}"><b>Grupo ${g.n}</b><span>${g.t}</span></div>`}
function render(spin){
  $('grid').innerHTML=GROUPS.map(g=>card(g,(d9.includes(g)?'out':'')+(spin===g?' spin':''))).join('');
  $('c9').innerHTML=d9.map(g=>`<div class="item">Grupo ${g.n}<small>${g.t}</small></div>`).join('');
  $('c2').innerHTML=d2.map(g=>`<div class="item">Grupo ${g.n}<small>${g.t}</small></div>`).join('');
}
async function draw(){
  if(busy||d9.length>=3)return;busy=true;$('draw').disabled=true;
  const winner=pool[rnd(pool.length)];
  let i=0,steps=18+rnd(8);
  for(let s=0;s<steps;s++){render(pool[i%pool.length]);i++;await new Promise(r=>setTimeout(r,60+s*9))}
  render(winner);await new Promise(r=>setTimeout(r,700));
  pool=pool.filter(g=>g!==winner);d9.push(winner);log.push(`Sorteio ${d9.length}: Grupo ${winner.n}`);
  if(d9.length===3){d2=pool.slice();pool=[];$('order').disabled=false}
  render();$('log').textContent=log.join('  |  ');busy=false;$('draw').disabled=d9.length>=3;
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function order(){d9=shuffle(d9);d2=shuffle(d2);log.push('Ordem de cada dia sorteada: a lista de cima abre o dia');render();$('log').textContent=log.join('  |  ')}
$('draw').onclick=draw;$('order').onclick=order;$('reset').onclick=()=>{if(!busy)init()};
init();
</script>
</body>
</html>
